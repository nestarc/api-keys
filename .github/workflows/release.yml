name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify-http:
    name: http consumer (Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: '10.4.20'
            script: 'test:consumer:http:nest10'
          - nest: '11.2.3'
            script: 'test:consumer:http:nest11'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - run: npm ci

      - run: npm run ${{ matrix.script }}

  verify-prisma:
    name: prisma storage (Prisma ${{ matrix.prisma }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prisma: '5.22.0'
            consumer: ''
          - prisma: '6.19.3'
            consumer: 'test:consumer:strict:legacy'
          - prisma: '7.10.0'
            consumer: 'test:consumer:strict:modern'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_keys_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_keys_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRISMA_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/api_keys_e2e?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - run: npm ci

      - name: Install matching Prisma CLI and client
        run: |
          runtime_root="${RUNNER_TEMP}/api-keys-prisma-${{ matrix.prisma }}"
          packages=("prisma@${{ matrix.prisma }}" "@prisma/client@${{ matrix.prisma }}")
          if [[ "${{ matrix.prisma }}" == 7.* ]]; then
            packages+=("@prisma/adapter-pg@${{ matrix.prisma }}")
          fi
          npm install --prefix "$runtime_root" --no-save --package-lock=false "${packages[@]}"
          echo "PRISMA_E2E_RUNTIME_ROOT=$runtime_root" >> "$GITHUB_ENV"

      - run: npm run test:e2e:prisma

      - name: Verify strict tarball consumer
        if: matrix.consumer != ''
        run: npm run ${{ matrix.consumer }}

  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: [verify-prisma, verify-http]
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --ci

      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Resolve npm dist-tag
        id: disttag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"
