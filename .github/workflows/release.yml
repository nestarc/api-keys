name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify-http:
    name: http consumer (Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: '10.4.20'
            script: 'test:consumer:http:nest10'
          - nest: '11.2.3'
            script: 'test:consumer:http:nest11'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - run: npm ci

      - run: npm run ${{ matrix.script }}

  verify-postgres:
    name: PostgreSQL 14/16 and Prisma 5/6/7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - run: npm ci

      - run: npm run test:e2e:postgres-matrix

  verify-packed-consumer:
    name: packed consumer (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nest 10 / Prisma 6
            script: test:consumer:strict:legacy
          - name: Nest 11 / Prisma 7
            script: test:consumer:strict:modern
          - name: Nest 11 / no Prisma
            script: test:consumer:no-prisma
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - run: npm ci

      - run: npm run ${{ matrix.script }}

  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: [verify-postgres, verify-packed-consumer, verify-http]
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --ci

      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Resolve npm dist-tag
        id: disttag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"
