name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage floor (node 22.13.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - run: npm run test:audit-policy

      - run: npm run audit:ci

      - run: npm run test:release:source

      - run: npm run build

      - run: npm run test:release:candidate

      - run: npm run test:release:workflow

      - run: npm run test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-summary-node-22.13.0
          path: |
            coverage/coverage-summary.json
            coverage/coverage-floor.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --ci

      - run: npm run build

      - run: npm run bench:smoke

  postgres-compatibility:
    name: PostgreSQL 14/16 and Prisma 5/6/7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - run: npm run test:e2e:postgres-matrix

  packed-consumer:
    name: packed consumer (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nest 10 / Prisma 6
            script: test:consumer:strict:legacy
          - name: Nest 11 / Prisma 7
            script: test:consumer:strict:modern
          - name: Nest 11 / no Prisma
            script: test:consumer:no-prisma
          - name: CommonJS / native ESM
            script: test:consumer:module-formats
          - name: Custom storage contract
            script: test:consumer:storage-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}

  http-consumer:
    name: http consumer (Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: '10.4.20'
            script: 'test:consumer:http:nest10'
          - nest: '11.2.3'
            script: 'test:consumer:http:nest11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}

  nest12-compatibility:
    name: Nest 12 compatibility (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run test:consumer:strict:nest12

      - run: npm run test:consumer:http:nest12
