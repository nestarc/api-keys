name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --ci

      - run: npm run build

      - run: npm run bench:smoke

  prisma-storage:
    name: prisma storage (Prisma ${{ matrix.prisma }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prisma: ['5.22.0', '6.19.3']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_keys_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_keys_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRISMA_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/api_keys_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install matching Prisma CLI and client
        run: npm install --no-save --package-lock=false prisma@${{ matrix.prisma }} @prisma/client@${{ matrix.prisma }}

      - run: npm run test:e2e:prisma

      - name: Verify strict Prisma 6 tarball consumer
        if: matrix.prisma == '6.19.3'
        run: npm run test:consumer:strict
