name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --ci

      - run: npm run build

      - run: npm run bench:smoke

  postgres-compatibility:
    name: PostgreSQL 14/16 and Prisma 5/6/7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - run: npm run test:e2e:postgres-matrix

  packed-consumer:
    name: packed consumer (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Nest 10 / Prisma 6
            script: test:consumer:strict:legacy
          - name: Nest 11 / Prisma 7
            script: test:consumer:strict:modern
          - name: Nest 11 / no Prisma
            script: test:consumer:no-prisma
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}

  http-consumer:
    name: http consumer (Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: '10.4.20'
            script: 'test:consumer:http:nest10'
          - nest: '11.2.3'
            script: 'test:consumer:http:nest11'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}
