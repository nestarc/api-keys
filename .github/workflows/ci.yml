name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --ci

      - run: npm run build

      - run: npm run bench:smoke

  prisma-storage:
    name: prisma storage (Prisma ${{ matrix.prisma }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - prisma: '5.22.0'
            consumer: ''
          - prisma: '6.19.3'
            consumer: 'test:consumer:strict:legacy'
          - prisma: '7.10.0'
            consumer: 'test:consumer:strict:modern'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_keys_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_keys_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRISMA_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/api_keys_e2e?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - name: Install matching Prisma CLI and client
        run: |
          runtime_root="${RUNNER_TEMP}/api-keys-prisma-${{ matrix.prisma }}"
          packages=("prisma@${{ matrix.prisma }}" "@prisma/client@${{ matrix.prisma }}")
          if [[ "${{ matrix.prisma }}" == 7.* ]]; then
            packages+=("@prisma/adapter-pg@${{ matrix.prisma }}")
          fi
          npm install --prefix "$runtime_root" --no-save --package-lock=false "${packages[@]}"
          echo "PRISMA_E2E_RUNTIME_ROOT=$runtime_root" >> "$GITHUB_ENV"

      - run: npm run test:e2e:prisma

      - name: Verify strict tarball consumer
        if: matrix.consumer != ''
        run: npm run ${{ matrix.consumer }}

  http-consumer:
    name: http consumer (Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: '10.4.20'
            script: 'test:consumer:http:nest10'
          - nest: '11.2.3'
            script: 'test:consumer:http:nest11'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }}
